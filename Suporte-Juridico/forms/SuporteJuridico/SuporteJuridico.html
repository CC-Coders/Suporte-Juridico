		<script>
			var beforeSendValidate = function (numState, nextState) {
				if (ValidaCampos()) {
					if ($("#modo").val() == "ADD") {
						$("#obra").val($("#selectObra").val());

						var json = [{
							"usuario": $("#usuarioLogado").val(),
							"data": BuscaDataAtual(),
							"descricao": $("#descricao").val(),
							"status": $("#atividade").val()
						}];

						$("#historico").val(JSON.stringify(json));
						$("#solicitante").val($("#usuario").val());
					}
					else {
						if ($("#atividade").val() == 1 || $("#atividade").val() == 0 || $("#atividade").val() == 4) {
							var json = JSON.parse($("#historico").val());
							json.push({
								"usuario": $("#usuarioLogado").val(),
								"data": BuscaDataAtual(),
								"descricao": $("#descricao").val(),
								"status": $("#atividade").val()
							});
							$("#historico").val(JSON.stringify(json));
						}
						else if ($("#atividade").val() == 5) {
							var json = JSON.parse($("#historico").val());

							json.push({
								"usuario": $("#usuarioLogado").val(),
								"data": BuscaDataAtual(),
								"descricao": (function () {
									if ($("#radioDecisao1").is(":checked")) {
										return $("#textareaMovimentar").val();
									}
									else if ($("#radioDecisao2").is(":checked")) {
										return "Retornado: " + $("#textareaMovimentar").val();
									}
									else {
										return "Cancelado: " + $("#textareaMovimentar").val();
									}
								}()),
								"status": $("#atividade").val()
							});
							$("#historico").val(JSON.stringify(json));
							$("#textAnaliseJuridico").val($("#textareaMovimentar").val());
							$("#usuAprovador").val($("#selectAprovador").val());
							$("#tempoGastoAnalise").val($("#textTempoGasto").val());
							$("#textTempoGasto").val("");
							if ($("#radioDecisao1").is(":checked")) {
								enviarEmail($("#atividade").val());
							}
						}
						else if ($("#atividade").val() == 7) {
							var json = JSON.parse($("#historico").val());
							json.push({
								"usuario": $("#usuarioLogado").val(),
								"data": BuscaDataAtual(),
								"descricao": ($("#radioDecisao1Aprov").is(":checked")) ? "Aprovado" : "Retornado: " + $("#textareaMotivoDecisaoAprov").val(),
								"status": $("#atividade").val()
							});
							$("#historico").val(JSON.stringify(json));
						}
						else if ($("#atividade").val() == 8) {
							var json = JSON.parse($("#historico").val());
							json.push({
								"usuario": $("#usuarioMovimentar").val(),
								"data": BuscaDataAtual(),
								"descricao": $("#textareaMovimentar").val(),
								"status": $("#atividade").val()
							});
							$("#historico").val(JSON.stringify(json));
							$("#tempoGastoResolucao").val($("#textTempoGasto").val());
							$("#textResolucaoJuridico").val($("#textareaMovimentar").val());
							if ($("#radioDecisao1").is(":checked")) {
								enviarEmail($("#atividade").val());
							}
						}
						else if ($("#atividade").val() == 11) {
							var json = JSON.parse($("#historico").val());

							json.push({
								"usuario": $("#usuarioLogado").val(),
								"data": BuscaDataAtual(),
								"descricao": ($("#radioDecisao1").is(":checked")) ? "Aprovado: " + $("#textareaMovimentar").val() : "Retornado: " + $("#textareaMovimentar").val(),
								"status": $("#atividade").val()
							});
							$("#historico").val(JSON.stringify(json));
						}
					}
				}
				else {
					return false;
				}
			}
		</script>
